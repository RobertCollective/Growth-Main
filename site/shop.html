<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050405">
  <title>GROWTH Shop — Coming Soon</title>
  <link rel="stylesheet" href="style.css?v=menu-hover-1">
  <link rel="stylesheet" href="homepage-controls.css?v=menu-ink-1">
  <style>
    .shop-coming-soon{min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:#050405;color:#fff;text-align:center}
    .shop-coming-soon__content{width:min(100%,760px)}
    .shop-coming-soon__brand{display:inline-block;margin-bottom:48px;color:#fff;font:900 24px/1 var(--display-font);text-decoration:none;text-transform:uppercase}
    .shop-coming-soon__eyebrow{margin:0 0 16px;color:#f6e31a;font:700 12px/1.4 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase}
    .shop-coming-soon h1{margin:0;color:#ff6aab;font:900 clamp(56px,12vw,112px)/.95 var(--display-font);text-transform:uppercase}
    .shop-coming-soon__copy{max-width:38ch;margin:20px auto 32px;color:#fff;font:400 16px/1.6 'DM Sans',sans-serif}
    .shop-coming-soon__links{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
    .shop-coming-soon__links a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 20px;border:1px solid #fff;color:#fff;font:700 12px/1 'DM Sans',sans-serif;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}
    .shop-coming-soon__links a:first-child{border-color:#f6e31a;background:#f6e31a;color:#050405}
  </style>
</head>
<body>
  <main class="shop-coming-soon">
    <div class="shop-coming-soon__content">
      <a class="shop-coming-soon__brand" href="index.html#top">GROWTH</a>
      <p class="shop-coming-soon__eyebrow">GROWTH Shop</p>
      <h1>Coming Soon</h1>
      <p class="shop-coming-soon__copy">The GROWTH Shop is on its way. Check back soon for event gear and more.</p>
      <nav class="shop-coming-soon__links" aria-label="Shop page navigation">
        <a href="index.html#tour">Explore the tour</a>
        <a href="index.html#top">Back home</a>
      </nav>
    </div>
  </main>
</body>
</html>
